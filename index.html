<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>厦门市妇幼保健院 · 检验报告时间查询</title>
<style>
  :root{
    --pink-50:#fff5f8; --pink-100:#ffe3ee; --pink-200:#ffc2d6;
    --pink-400:#ff7aa8; --pink-500:#f5578f; --pink-600:#e23a77;
    --pink-700:#c2255f; --ink:#5b2333; --ink-soft:#9b5a6e; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:linear-gradient(160deg,#fff0f5 0%,#ffe6ef 40%,#fff8fa 100%);
    min-height:100vh;color:var(--ink);
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px 60px}
  header{text-align:center;padding:44px 12px 26px}
  .logo{
    width:88px;height:88px;margin:0 auto 14px;border-radius:50%;
    object-fit:cover;background:#fff;border:3px solid #fff;
    box-shadow:0 8px 22px rgba(245,87,143,.35);
  }
  header h1{font-size:26px;letter-spacing:1px}
  header h1 span{color:var(--pink-600)}
  header p{color:var(--ink-soft);font-size:13.5px;margin-top:8px}
  .searchbox{
    max-width:640px;margin:22px auto 0;display:flex;align-items:center;
    background:#fff;border-radius:999px;padding:6px 8px 6px 22px;
    box-shadow:0 10px 30px rgba(226,58,119,.14);border:1.5px solid var(--pink-100);
    transition:.25s;
  }
  .searchbox:focus-within{border-color:var(--pink-400);box-shadow:0 12px 34px rgba(245,87,143,.24)}
  .searchbox svg{flex:none;color:var(--pink-400)}
  #q{flex:1;border:none;outline:none;font-size:16px;padding:10px 12px;background:transparent;color:var(--ink);min-width:0}
  #q::placeholder{color:#d9a3b5}
  #clearBtn{border:none;background:var(--pink-100);color:var(--pink-700);cursor:pointer;width:34px;height:34px;border-radius:50%;font-size:15px;flex:none;display:none}
  .stats{text-align:center;font-size:13px;color:var(--ink-soft);margin:26px 0 14px}
  .stats b{color:var(--pink-600)}
  #list{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--card);border-radius:16px;padding:16px 18px;border:1px solid var(--pink-100);box-shadow:0 4px 16px rgba(226,58,119,.07);transition:.2s;animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card:hover{box-shadow:0 10px 26px rgba(226,58,119,.16);transform:translateY(-2px)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .proj{font-size:16px;font-weight:600;line-height:1.5;flex:1}
  .proj mark{background:var(--pink-100);color:var(--pink-700);border-radius:4px;padding:0 2px}
  .abbr{display:inline-block;margin-left:8px;font-size:12px;font-weight:500;color:var(--pink-600);background:var(--pink-50);border:1px solid var(--pink-200);border-radius:6px;padding:1px 7px;vertical-align:2px}
  .tags{display:flex;gap:8px;flex:none}
  .tag{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .tag.zhenhai{background:#e8f4ff;color:#2277bb;border:1px solid #c3e0f7}
  .tag.jimei{background:#eafaf1;color:#1d9d5f;border:1px solid #c4ecd6}
  .card-time{margin-top:10px;display:flex;gap:10px;align-items:flex-start;background:var(--pink-50);border-radius:10px;padding:10px 12px}
  .clock{flex:none;color:var(--pink-500);margin-top:1px}
  .time-main{font-size:15px;color:var(--pink-700);font-weight:600;line-height:1.5}
  .sample{margin-top:11px;font-size:15px;color:var(--ink);display:flex;gap:8px;align-items:flex-start;line-height:1.6}
  .sample b{color:var(--pink-600);font-weight:600;flex:none;font-size:15px}
  .empty{text-align:center;padding:60px 0;color:var(--ink-soft)}
  .empty .big{font-size:44px;margin-bottom:10px}
  footer{text-align:center;font-size:12px;color:#cf9aae;margin-top:36px;line-height:1.8}
  #more{display:block;margin:22px auto 0;border:none;cursor:pointer;background:#fff;color:var(--pink-600);border:1.5px solid var(--pink-200);padding:9px 34px;border-radius:999px;font-size:14px;transition:.2s}
  #more:hover{background:var(--pink-500);color:#fff;border-color:transparent}
  @media(max-width:560px){header h1{font-size:21px}.proj{font-size:15px}}
</style>
</head>

const DATA = RAW.trim().split('\n').map(line=>{
  const p = line.split('|');
  return {项目:p[0]||'', 简称:p[1]||'', 院区:p[2]||'', 报告时间:p[3]||'', 采样要求:p[4]||''};
});

const PAGE = 60;
let query='', shown=PAGE;

function fuzzy(q,text){
  const t=(text||'').toLowerCase(),qq=q.toLowerCase().trim();
  if(!qq)return 1;
  if(t.includes(qq))return 100+(qq.length/t.length)*10;
  let i=0,score=0,streak=0;
  for(const ch of t){
    if(ch===qq[i]){i++;streak++;score+=1+streak*0.3;}
    else streak=0;
    if(i===qq.length)break;
  }
  return i===qq.length?score:0;
}

function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hl(text,q){
  const e=esc(text);
  if(!q||!text)return e;
  const i=text.toLowerCase().indexOf(q.toLowerCase().trim());
  if(i<0)return e;
  const L=q.trim().length;
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+L))+'</mark>'+esc(text.slice(i+L));
}

function search(){
  const q=query.trim();
  let res=DATA;
  if(q){
    res=res.map(d=>{
      const s=Math.max(fuzzy(q,d.项目),fuzzy(q,d.简称)*1.05,fuzzy(q,d.报告时间)*0.7);
      return [s,d];
    }).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  }
  return res;
}

function render(){
  const res=search();
  const list=document.getElementById('list');
  document.getElementById('stats').innerHTML=
    `共 <b>${DATA.length}</b> 条记录 · 当前筛选 <b>${res.length}</b> 条`;
  const more=document.getElementById('more');
  if(res.length>shown){
    more.style.display='block';
    more.textContent=`显示更多 ▾（还有 ${res.length-shown} 条）`;
  }else more.style.display='none';

  if(!res.length){
    list.innerHTML=`<div class="empty"><div class="big">🌷</div>没有找到相关项目<br><span style="font-size:12.5px">换个关键词试试</span></div>`;
    return;
  }
  list.innerHTML=res.slice(0,shown).map(d=>`
    <div class="card">
      <div class="card-top">
        <div class="proj">${hl(d.项目,query)}${d.简称?`<span class="abbr">${hl(d.简称,query)}</span>`:''}</div>
        <div class="tags">
          <span class="tag ${d.院区==='集美院区'?'jimei':'zhenhai'}">${esc(d.院区)}</span>
        </div>
      </div>
      <div class="card-time">
        <svg class="clock" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <div>
          <div class="time-main">⏱ ${esc(d.报告时间)}</div>
        </div>
      </div>
      ${d.采样要求?`<div class="sample"><b>🧪 采样要求</b><span>${esc(d.采样要求)}</span></div>`:''}
    </div>`).join('');
}
document.getElementById('more').onclick=()=>{shown+=PAGE;render()};

let timer;
const input=document.getElementById('q'),clearBtn=document.getElementById('clearBtn');
input.addEventListener('input',()=>{
  clearBtn.style.display=input.value?'block':'none';
  clearTimeout(timer);
  timer=setTimeout(()=>{query=input.value;shown=PAGE;render()},180);
});
clearBtn.onclick=()=>{input.value='';clearBtn.style.display='none';query='';shown=PAGE;render();input.focus()};
